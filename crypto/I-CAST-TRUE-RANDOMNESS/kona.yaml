challenges:
  - category: crypto
    name: I CAST TRUE RANDOMNESS!
    author: TSakuyaiba
    description: |
     <img src="https://media1.tenor.com/m/9-kJ6wVClJoAAAAd/neverwinter-d20.gif">
      
      **True Randomness** is a legendary divination spell invented by Rudy.
      The Astral Dice are rolled in pairs, their echoes twisted together.
      The scribe records only the upper half of each omen.

      Every eighth omen, Rudy offers one extra roll to the gods. That roll
      never appears in the log.

      > "I CAST TRUE RANDOMNESS!" -> NAT 20!

      After 2,400 omens, eight more rolls become the key to the Astral Vault.
      Rudy leaves you the ritual and the scribe's log.

      "You cannot predict what you cannot see... right?"

    tags:
      - Hard
    attachments:
      files:
        - release/chall.py
        - release/output.txt
      strip_components: 1
    flags:
      rctf: 'CYB26{hahahahahahaha:_you_fell_into_my_trap_the_dice_is_never_random_or_is_it_^^?}'
