challenges:
  - category: crypto
    name: I CAST ARCANE LOCK... TWICE!
    author: TSakuyaiba
    description: |
      **Double Arcane Lock** is an abjuration spell used to protect a secret
      scroll. Two wizards cast different incantations upon the same runic
      circle, believing that two different powers will create two independent
      layers of protection.

      Rudy raises his staff: "I CAST ARCANE LOCK!" — NAT 15!

      Then Seria follows: "I CAST ARCANE LOCK!" — NAT 20!

      Surely it is twice as secure... right?
    tags:
      - Easy
    attachments:
      files:
        - release/chall.py
      strip_components: 1
    flags:
      rctf: 'CYB26{rudy_said_:ohh_come_on_event_with_nat_20_still_not_working!!!_i_must_go_back_to_the_academy}'
