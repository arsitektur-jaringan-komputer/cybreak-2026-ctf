challenges:
  - category: web
    name: classroom
    author: abdiery
    description: |
      A classroom is far more than just four walls and a set of desks. It is a
      dynamic, living ecosystem where structured learning, spontaneous
      curiosity, and social development converge.

      The school principal or headmaster may give the task with the specific
      file named `rockyou.txt` if needed.
    tags:
      - Medium
    attachments:
      pre_compressed:
        - release/classroom_dist.zip
    flags:
      rctf:
        - provider: flags/dynamic
          config:
            base: 'CYB26{t0d4y_cl4ss_1S_h0w_T0_Ch4in1n9}'
            mode: tail
    instancerConfig:
      instancer: docker
      challengeIntegrationId: classroom
      timeoutMilliseconds: 600000
      extendable: true
      config:
        services:
          app:
            image: cybreak/classroom:latest
            hostname: classroom
            environment:
              NODE_ENV: production
              PORT: '3000'
              RCTF_FLAG: ${RCTF_FLAG}
            networks:
              - egress
            read_only: false
            cap_drop: []
            mem_limit: 512m
            cpus: 1
            pids_limit: 128
        networks:
          egress:
            internal: false
      expose:
        - kind: https
          hostPrefix: classroom
          containerName: app
          containerPort: 3000
          title: classroom
