challenges:
  - category: web
    name: Simple App
    author: rootkids
    description: |
      Nothing, just simple app
    tags:
      - Hard
    attachments:
      pre_compressed:
        - release/simple-app.zip
    flags:
      rctf: "CYB26{kata_mirai_'yahaha ai mu walaupun curang pake agentic gaada yang bisa solve soalku'_awokwaok}"
    instancerConfig:
      instancer: docker
      challengeIntegrationId: simple-app
      timeoutMilliseconds: 1800000
      extendable: true
      config:
        services:
          app:
            image: cybreak/simple-app:latest
            read_only: false
            mem_limit: 256m
            cpus: 0.5
            pids_limit: 128
      expose:
        - kind: https
          hostPrefix: simple-app
          containerName: app
          containerPort: 5000
          title: Simple App
