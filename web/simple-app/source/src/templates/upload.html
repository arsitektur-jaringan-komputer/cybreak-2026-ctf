<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Upload</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111522;
      --panel: #1b2234;
      --ink: #f5f7ff;
      --muted: #aeb8cf;
      --line: #4b5778;
      --coin: #ffd166;
      --blue: #58a6ff;
      --green: #42d77d;
      --green-dark: #27a85b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        radial-gradient(circle at top, #202a44 0, var(--bg) 44rem);
      background-size: 18px 18px, 18px 18px, auto;
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      min-height: 100vh;
    }

    .scanline {
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.035),
        rgba(255,255,255,.035) 1px,
        transparent 1px,
        transparent 5px
      );
      inset: 0;
      pointer-events: none;
      position: fixed;
    }

    .shell {
      margin: 0 auto;
      max-width: 700px;
      padding: 28px 20px 52px;
      position: relative;
    }

    header {
      border-left: 6px solid var(--coin);
      margin-bottom: 18px;
      padding-left: 14px;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1;
      text-transform: uppercase;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
      margin-top: 8px;
    }

    .panel {
      background: var(--panel);
      border: 2px solid var(--line);
      box-shadow: 0 0 0 4px rgba(0,0,0,.25);
      padding: 18px;
    }

    .badge {
      background: #0c101b;
      border: 2px solid var(--line);
      color: var(--coin);
      display: inline-flex;
      font-weight: 700;
      margin-bottom: 16px;
      padding: 7px 9px;
      text-transform: uppercase;
    }

    label {
      color: var(--coin);
      display: block;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    input[type="file"] {
      background: #0c101b;
      border: 2px solid var(--line);
      color: var(--ink);
      display: block;
      font: inherit;
      margin-bottom: 18px;
      padding: 12px;
      width: 100%;
    }

    input[type="file"]::file-selector-button {
      background: var(--blue);
      border: 0;
      box-shadow: inset -3px -3px 0 rgba(0,0,0,.25), inset 3px 3px 0 rgba(255,255,255,.18);
      color: #07101f;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      margin-right: 12px;
      padding: 9px 12px;
      text-transform: uppercase;
    }

    input[type="submit"],
    a.button {
      border: 0;
      box-shadow: inset -3px -3px 0 rgba(0,0,0,.25), inset 3px 3px 0 rgba(255,255,255,.18);
      cursor: pointer;
      display: inline-flex;
      font: inherit;
      font-weight: 700;
      justify-content: center;
      min-height: 44px;
      padding: 12px 16px;
      text-decoration: none;
      text-transform: uppercase;
      width: 100%;
    }

    input[type="submit"] {
      background: var(--green);
      color: #07100b;
    }

    input[type="submit"]:hover {
      background: var(--green-dark);
    }

    a {
      color: var(--blue);
      display: inline-block;
      margin-top: 24px;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <main class="shell">
    <header>
      <h1>Inventory Upload</h1>
      <p>This module is under construction. Inventory uploads are still accepted.</p>
    </header>

    <section class="panel">
      <span class="badge">Inventory station</span>
      <form method="post" enctype="multipart/form-data">
        <label for="file">File slot</label>
        <input id="file" type="file" name="file" required />
        <input type="submit" value="Upload Item" />
      </form>
    </section>

    <a href="/">Back to dashboard</a>
  </main>
</body>
</html>
