challenges:
  - category: web
    name: Impossible Web
    author: rootkids
    description: |
      Impossible, but I guest nothing is impossible? right?

      NOTE: Solve locally first!!! after you solve local and can't solve remotely, please dm @rootkids
    tags:
      - Hard
    attachments:
      pre_compressed:
        - release/impossible-web.zip
    flags:
      rctf: "CYB26{kata_mirai_'yahaha ai mu walaupun curang pake agentic gaada yang bisa solve soalku'_awokwaok}"
    instancerConfig:
      instancer: docker
      challengeIntegrationId: impossible-web
      timeoutMilliseconds: 1800000
      extendable: true
      config:
        services:
          app:
            image: cybreak/impossible-web:latest
            read_only: false
            mem_limit: 768m
            cpus: 0.5
            pids_limit: 128
      expose:
        - kind: https
          hostPrefix: impossible-web
          containerName: app
          containerPort: 5000
          title: Impossible Web
