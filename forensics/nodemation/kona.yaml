challenges:
  - category: forensics
    name: nodemation
    author: UrSourceCode
    description: |
      An n8n automation host was isolated after suspicious workflow executions and local
      outbound traffic were observed. Analyze the supplied incident archive, then answer
      the forensic quiz service to recover the flag.
    tags:
      - Medium
    attachments:
      files:
        - release/nodemation.zip
      strip_components: 1
    flags:
      rctf:
        - provider: flags/dynamic
          config:
            base: 'CYB26{izin_bikin_soal_forens_biar_mykisah_bangga}'
            mode: tail
    instancerConfig:
      instancer: docker-nodemation
      challengeIntegrationId: nodemation
      timeoutMilliseconds: 600000
      extendable: true
      config:
        services:
          challenge:
            image: cybreak/nodemation:latest
            environment:
              RCTF_FLAG: ${RCTF_FLAG}
              QUIZ_LOG: /tmp/answers.log
            networks:
            - egress
            read_only: true
            mem_limit: 64m
            cpus: 0.5
            pids_limit: 64
            tmpfs:
              /tmp: size=16m,mode=1777
        networks:
          egress:
            internal: false
      expose:
      - kind: tcp-ssl
        hostPrefix: nodemation
        containerName: challenge
        containerPort: 31338
        title: nodemation
