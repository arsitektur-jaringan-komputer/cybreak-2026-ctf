      - Medium
    attachments:
      files:
        - release/nodemation.zip
      strip_components: 1
    endpoints:
      - type: nc
        endpoint: ctf.cybreak.org
        port: 4002
    flags:
      rctf: 'CYB26{5usp1c10us_w0rkfl0w_3xecut10n_iN_n8n_s4ndb0x}'
